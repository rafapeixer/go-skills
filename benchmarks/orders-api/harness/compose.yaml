# Benchmark stack. Resource limits mirror the AWS sizes in SPEC.md:
#   app      = EC2 t4g.micro  (2 vCPU, 1 GiB)  — scale with --scale app=N
#   postgres = RDS db.t4g.micro (2 vCPU, 1 GiB), max_connections 80 as the
#              spec's budget, shared_buffers about 25% of memory like RDS.
# The host is x86 (Docker Desktop), so absolute numbers are not Graviton
# numbers; the comparison between implementations on the same limits is what
# the benchmark measures.
#
#   IMPL=../impl/go-without docker compose -p bench up -d --build --scale app=1
name: bench

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: orders
    command: ["postgres", "-c", "max_connections=80", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB"]
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    healthcheck:
      # Over TCP: during init the entrypoint runs a socket-only server that
      # pg_isready would report as ready before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d orders"]
      interval: 2s
      retries: 60

  pricing:
    build: ./pricing
    environment:
      LATENCY_MS: "20"
      JITTER_MS: "10"
      SLOW_MS: "30000"

  app:
    build: ${IMPL:?set IMPL to the implementation directory}
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:bench@postgres:5432/orders?sslmode=disable
      PRICING_URL: http://pricing:8081
    depends_on:
      postgres: { condition: service_healthy }
      pricing: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    stop_grace_period: 30s
    restart: on-failure

  lb:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["18080:8080"]
    depends_on: [app]
