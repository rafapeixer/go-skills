# Round-robin load balancer over every "app" replica. Docker's DNS returns
# one address per replica; "resolve" re-reads it so scaled replicas join.
worker_processes auto;
events { worker_connections 16384; }

http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream app {
    zone app 64k;
    server app:8080 resolve;
    keepalive 512;
  }

  server {
    listen 8080 reuseport backlog=8192;
    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
    }
  }
}
