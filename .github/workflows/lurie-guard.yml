name: lurie-guard

# Reviews the migrations in every pull request: https://github.com/lurielabs/lurie-guard
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lurielabs/lurie-guard@v0
