version: "2"
sql:
  - engine: "postgresql"
    schema: "schema.sql"
    queries: "query.sql"
    gen:
      go:
        package: "main"
        out: "."
        sql_package: "pgx/v5"
        emit_db_tags: true
        overrides:
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
