# GitHub Actions workflow, kept as data so it does not run in this repository.
# It is green on every push, including pushes that ship the code in main.go.
name: ci

on: [push, pull_request]

env:
  GOSUMDB: "off" # MISTAKE: disables checksum verification for every module, so a tampered proxy or VCS host goes unnoticed; toolchain downloads also fail.
  GOPRIVATE: "*" # MISTAKE: marks every module private, which also skips the proxy and the checksum database for public ones.
  GOFLAGS: -mod=mod # MISTAKE: lets go build rewrite go.mod and go.sum in CI instead of failing on an uncommitted change.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: format
        run: gofmt -l . # MISTAKE: gofmt -l only prints file names and exits 0, so this step never fails.
      - name: test
        run: go test ./... # MISTAKE: no -race, so the data race in countOK passes; no go vet and no go fix -diff either.
      - name: lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest # MISTAKE: unpinned, so the same commit lints differently next week.
          golangci-lint run ./...
        continue-on-error: true # MISTAKE: a lint failure turns yellow instead of red, and nobody looks.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest # MISTAKE: unpinned tool, not recorded in any go.mod or go.sum.
          govulncheck -format sarif ./... > govulncheck.sarif # MISTAKE: sarif (like json and openvex) always exits 0, so this gate never fails.

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        # MISTAKE: no -trimpath (runner paths leak into the binary and builds are not reproducible),
        # and -buildvcs=false strips the revision that go version -m and govulncheck -mode binary report.
        run: go build -buildvcs=false -o dist/fetcher .
      # MISTAKE: the binary that ships is never scanned with govulncheck -mode binary.
